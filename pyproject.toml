[project]
name = "vox"
version = "0.1.0"
description = "Local voice + text controlled desktop agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "rich",
    "send2trash",
    "psutil",
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "mypy",
    "types-PyYAML",
    "types-psutil",
    "types-pywin32",
    "types-Send2Trash",
]

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vox*"]
