[project]
name = "vox"
version = "0.1.0"
description = "Local voice + text controlled desktop agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "rich",
    "send2trash",
    "psutil",
    "requests",
    "yt-dlp",
    "python-docx",
    "reportlab",
    "sounddevice",
    "numpy",
    "faster-whisper",
    "onnxruntime",
    "piper-tts",
    "pynput",
    "ollama",
    "pywin32; sys_platform == 'win32'",
    "pillow; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "mypy",
    "types-PyYAML",
    "types-psutil",
    "types-pywin32",
    "types-Send2Trash",
    "types-requests",
    "types-pynput",
]

[tool.mypy]
# numpy's stubs use 3.12+ `type` statement syntax; this project is pinned to
# build against 3.14 specifically (spec Section 3: "Build against Python
# 3.14. Do not downgrade"), so check against the real interpreter version
# rather than the requires-python floor of 3.11.
python_version = "3.14"
strict = true

# python-docx, reportlab, yt-dlp, onnxruntime, sounddevice, faster_whisper
# and piper ship no type stubs anywhere and no types-* package exists for
# any of them (verified: `pip index versions types-onnxruntime` etc. all
# 404) — scoped at the module boundary via the standard mypy mechanism for
# stub-less third-party libraries, rather than a type: ignore on every call
# site. Contrast pynput and Pillow above, which do have real fixes. See
# DECISIONS.md.
[[tool.mypy.overrides]]
module = ["docx.*", "reportlab.*", "yt_dlp.*", "onnxruntime.*", "sounddevice.*", "faster_whisper.*", "piper.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vox*"]
